name: Deploy Firebase Hosting

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Never run two production deploys at once; queue instead of cancelling.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'deploy' }}
  cancel-in-progress: false

# Keyless auth: GitHub's OIDC token is exchanged for short-lived Google credentials via
# Workload Identity Federation. No service-account key and no repository secrets needed.
permissions:
  contents: read
  id-token: write

env:
  # Firebase web config is public by design (it ships in every page load), so it lives here.
  VITE_FIREBASE_API_KEY: AIzaSyAaGPkRzftcI83LmQosIkjHFKofGALxLvo
  VITE_FIREBASE_AUTH_DOMAIN: project-dc59a57a-442b-4b6a-a3f.firebaseapp.com
  VITE_FIREBASE_PROJECT_ID: project-dc59a57a-442b-4b6a-a3f
  VITE_FIREBASE_STORAGE_BUCKET: project-dc59a57a-442b-4b6a-a3f.firebasestorage.app
  VITE_FIREBASE_MESSAGING_SENDER_ID: "767682202840"
  VITE_FIREBASE_APP_ID: 1:767682202840:web:678481c0d30cb04e5ddbad

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/767682202840/locations/global/workloadIdentityPools/github/providers/expense-tracker
          service_account: github-deployer@project-dc59a57a-442b-4b6a-a3f.iam.gserviceaccount.com

      - name: Validate deploy (pull requests)
        if: github.event_name == 'pull_request'
        run: npx firebase deploy --only hosting,firestore --dry-run --non-interactive

      - name: Deploy hosting and Firestore config
        # main only: a manual dispatch on a feature branch must not deploy it to production.
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: npx firebase deploy --only hosting,firestore --non-interactive
